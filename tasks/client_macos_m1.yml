---
- name: Check if brew is installed
  become: true
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    command -v brew
  args:
    executable: /bin/bash
  register: does_brew_exist
  ignore_errors: true
  changed_when: false

- name: Install brew
  ansible.builtin.shell: |
      # install.sh seems to be prompting for a sudo check. Set CI=1 (or other settings) to skip.
      export CI=1
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  when: does_brew_exist.rc
  changed_when: false

- name: Install node_exporter
  community.general.homebrew:
    name: node_exporter
    state: present
  become: false

- name: Copy the node_exporter launchd service file
  become: true
  ansible.builtin.template:
    src: homebrew.mxcl.node_exporter.plist
    dest: /Library/LaunchDaemons/homebrew.mxcl.node_exporter.plist
    owner: root
    group: "{{ node_exporter_root_group }}"
    mode: "0644"
  notify: Restart node_exporter osx homebrew

- name: Flush handlers
  become: true
  ansible.builtin.meta: flush_handlers

- name: End the play for hosts that run macOS arm64
  become: true
  ansible.builtin.meta: end_host
  when:
    - ansible_distribution == 'MacOSX'
    - ansible_architecture == 'arm64'
