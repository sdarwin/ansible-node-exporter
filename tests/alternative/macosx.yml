---
- name: Test macos
  hosts: localhost
  tasks:
    - name: Check processes
      ansible.builtin.shell: |
         set -o pipefail
         ps -ef | grep node || true
      register: out
      changed_when: false
      failed_when: false
    - name: Debug stdout
      ansible.builtin.debug:
        var: out.stdout_lines

    - name: Check ports
      ansible.builtin.shell: |
        set -o pipefail
        netstat -anvp tcp | awk 'NR<3 || /LISTEN/'
      register: out
      changed_when: false
      failed_when: false
    - name: Debug stdout
      ansible.builtin.debug:
        var: out.stdout_lines

    - name: Check if node_exporter is listening on port 8080  # noqa command-instead-of-module
      ansible.builtin.command: curl -k -u randomuser:examplepassword https://localhost:8080
      changed_when: false
      register: out
    - name: Debug stdout
      ansible.builtin.debug:
        var: out.stdout_lines
    - name: Debug stderr
      ansible.builtin.debug:
        var: out.stderr_lines
