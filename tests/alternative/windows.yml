---
- name: Test windows
  hosts: localhost
  tasks:
    - name: Check if node_exporter is listening on port 8080 http  # noqa command-instead-of-module
      ansible.builtin.command: curl -k -u randomuser:examplepassword http://localhost:8080
      changed_when: false
      register: out
      # should fail:
      failed_when: false
    - name: Debug stdout
      ansible.builtin.debug:
        var: out.stdout_lines
    - name: Debug stderr
      ansible.builtin.debug:
        var: out.stderr_lines

    - name: Check if node_exporter is listening on port 8080 https  # noqa command-instead-of-module
      ansible.builtin.command: curl -k -u randomuser:examplepassword https://localhost:8080
      changed_when: false
      register: out
    - name: Debug stdout
      ansible.builtin.debug:
        var: out.stdout_lines
    - name: Debug stderr
      ansible.builtin.debug:
        var: out.stderr_lines
